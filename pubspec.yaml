name: hetna_cnc
description: Cotizador profesional HETNA CNC
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: 1.10.25

  # PDF y compartir
  pdf: ^3.10.8
  printing: ^5.12.0

  # Archivos
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  share_plus: ^9.0.0

  # Links externos (WhatsApp)
  url_launcher: ^6.2.0

  # Notificaciones locales
  flutter_local_notifications: ^17.0.0

  # Almacenamiento local
  shared_preferences: ^2.2.3

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6

  # Gráficas Dashboard
  fl_chart: ^0.68.0

  # Contactos del celular
  flutter_contacts: ^1.1.7+1

  # Excel export
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
