name: hetna_cnc
description: Cotizador profesional HETNA CNC
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: 1.10.25

  # PDF y compartir
  pdf: ^3.10.8
  printing: ^5.12.0

  # Archivos y selección de PDFs
  path_provider: ^2.1.2
  file_picker: ^8.0.0

  # Links externos (WhatsApp, abrir URLs)
  url_launcher: ^6.2.0

  # Notificaciones locales
  flutter_local_notifications: ^17.0.0

  # Almacenamiento local
  sqflite: ^2.3.2
  shared_preferences: ^2.2.3

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.3.3
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
