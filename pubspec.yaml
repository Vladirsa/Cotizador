name: hetna_cnc
description: Cotizador profesional HETNA CNC
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.3.0

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2

  # WhatsApp / URL
  url_launcher: ^6.2.5

  # Notificaciones locales (alertas automáticas)
  flutter_local_notifications: ^17.0.0

  # Almacenamiento local (offline)
  sqflite: ^2.3.2
  shared_preferences: ^2.2.3

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.3.3
  file_picker: ^8.0.3
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

  # Iconos
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/logo/
