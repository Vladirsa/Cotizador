name: Build HETNA CNC APK + AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.19.6
          channel: stable
      - run: flutter create --org com.hetnacnc --project-name hetna_cnc tmp_app
      - name: Fix versions
        run: |
          sed -i 's/1.7.10/1.9.22/' tmp_app/android/settings.gradle
          sed -i 's/"com.android.application" version "7.3.0"/"com.android.application" version "8.1.0"/' tmp_app/android/settings.gradle
          sed -i 's/gradle-7.6.3-all.zip/gradle-8.3-all.zip/' tmp_app/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/flutter.compileSdkVersion/34/' tmp_app/android/app/build.gradle
          sed -i 's/flutter.targetSdkVersion/34/' tmp_app/android/app/build.gradle
          sed -i 's/flutter.minSdkVersion/21/' tmp_app/android/app/build.gradle
      - name: Add Internet Permission
        run: |
          MANIFEST="tmp_app/android/app/src/main/AndroidManifest.xml"
          grep -q "INTERNET" $MANIFEST || sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application/' $MANIFEST
          cat $MANIFEST
      - name: Add Camera Permission (escáner de código de barras)
        run: |
          MANIFEST="tmp_app/android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.CAMERA' $MANIFEST || \
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application|' $MANIFEST
          cat $MANIFEST
      - name: Add Package Visibility (WhatsApp / WhatsApp Business)
        run: |
          MANIFEST="tmp_app/android/app/src/main/AndroidManifest.xml"
          python3 - <<'PYEOF'
          path = "tmp_app/android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          queries = (
              '    <queries>\n'
              '        <package android:name="com.whatsapp.w4b" />\n'
              '        <package android:name="com.whatsapp" />\n'
              '    </queries>\n'
          )
          if '<queries>' not in content:
              content = content.replace('</manifest>', queries + '</manifest>', 1)
              with open(path, 'w') as f:
                  f.write(content)
              print("Bloque <queries> agregado")
          else:
              print("<queries> ya existia, no se duplico")
          PYEOF
          cat $MANIFEST
      - name: Add Deep Link intent-filter (recuperar contraseña)
        run: |
          MANIFEST="tmp_app/android/app/src/main/AndroidManifest.xml"
          python3 - <<'PYEOF'
          import re
          path = "tmp_app/android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          deep_link = (
              '        <intent-filter>\n'
              '            <action android:name="android.intent.action.VIEW" />\n'
              '            <category android:name="android.intent.category.DEFAULT" />\n'
              '            <category android:name="android.intent.category.BROWSABLE" />\n'
              '            <data android:scheme="com.hetnacnc.app" android:host="reset-callback" />\n'
              '        </intent-filter>\n'
          )
          if 'reset-callback' not in content:
              # Insertar justo antes del cierre de </activity>
              content = content.replace('</activity>', deep_link + '    </activity>', 1)
              with open(path, 'w') as f:
                  f.write(content)
              print("Deep link intent-filter agregado")
          else:
              print("Deep link ya existia, no se duplico")
          PYEOF
          cat $MANIFEST
      - name: Add FileProvider (compartir PDF con WhatsApp Business)
        run: |
          mkdir -p tmp_app/android/app/src/main/res/xml
          cat > tmp_app/android/app/src/main/res/xml/file_paths.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="pdfs" path="." />
          </paths>
          XMLEOF
          python3 - <<'PYEOF'
          path = "tmp_app/android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          provider = (
              '        <provider\n'
              '            android:name="androidx.core.content.FileProvider"\n'
              '            android:authorities="${applicationId}.fileprovider"\n'
              '            android:exported="false"\n'
              '            android:grantUriPermissions="true">\n'
              '            <meta-data\n'
              '                android:name="android.support.FILE_PROVIDER_PATHS"\n'
              '                android:resource="@xml/file_paths" />\n'
              '        </provider>\n'
          )
          if 'fileprovider' not in content:
              content = content.replace('</application>', provider + '    </application>', 1)
              with open(path, 'w') as f:
                  f.write(content)
              print("FileProvider agregado")
          else:
              print("FileProvider ya existia, no se duplico")
          PYEOF
          cat tmp_app/android/app/src/main/AndroidManifest.xml
      - name: Inject MainActivity.kt personalizado (canal WhatsApp Business)
        run: |
          MAIN_ACTIVITY=$(find tmp_app/android/app/src/main -name "MainActivity.kt" | head -1)
          echo "Encontrado: $MAIN_ACTIVITY"
          PACKAGE_LINE=$(grep '^package ' "$MAIN_ACTIVITY")
          PACKAGE=${PACKAGE_LINE#package }
          echo "Paquete detectado: $PACKAGE"
          cat > "$MAIN_ACTIVITY" << KOTLINEOF
          package $PACKAGE

          import android.content.Intent
          import android.net.Uri
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.hetnacnc.app/whatsapp_share"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "compartirWhatsAppBusiness") {
                          val filePath = call.argument<String>("filePath")
                          val paquete = call.argument<String>("paquete") ?: "com.whatsapp.w4b"
                          try {
                              val file = File(filePath!!)
                              val uri: Uri = FileProvider.getUriForFile(
                                  this, "\${applicationContext.packageName}.fileprovider", file)
                              val intent = Intent(Intent.ACTION_SEND).apply {
                                  type = "application/pdf"
                                  putExtra(Intent.EXTRA_STREAM, uri)
                                  setPackage(paquete)
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              startActivity(intent)
                              result.success(true)
                          } catch (e: Exception) {
                              result.error("ERROR", e.message, null)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          KOTLINEOF
          cat "$MAIN_ACTIVITY"
      - name: Inject HETNA CNC App Icon
        run: |
          mkdir -p tmp_app/android/app/src/main/res/mipmap-mdpi
          echo "" | base64 -d > tmp_app/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          echo "" | base64 -d > tmp_app/android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
      - name: Inject Firebase google-services.json
        run: |
          echo "" | base64 -d > tmp_app/android/app/google-services.json
          echo "google-services.json inyectado"
      - name: Fix compileSdkVersion only
        run: |
          APPGRADLE=tmp_app/android/app/build.gradle
          # Solo cambiar compileSdkVersion de 33 a 34
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/' $APPGRADLE
          sed -i 's/targetSdkVersion 33/targetSdkVersion 34/' $APPGRADLE
          # Agregar permiso READ_CONTACTS si no existe
          MANIFEST=tmp_app/android/app/src/main/AndroidManifest.xml
          grep -q "READ_CONTACTS" $MANIFEST || \
            sed -i 's|<application|<uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <application|' $MANIFEST
          echo "=== Verificacion ==="
          grep "compileSdk\|targetSdk" $APPGRADLE
      - run: cp -r lib/* tmp_app/lib/ && cp pubspec.yaml tmp_app/pubspec.yaml && cp l10n.yaml tmp_app/l10n.yaml && flutter pub get
      - run: flutter pub get
        working-directory: tmp_app
      - run: flutter build apk --release --split-per-abi
        working-directory: tmp_app
      - run: flutter build appbundle --release
        working-directory: tmp_app
      - name: Sign APK and AAB
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/hetna_cnc.keystore
          # Firmar APKs
          for apk in tmp_app/build/app/outputs/flutter-apk/app-*-release.apk; do
            aligned="${apk%.apk}-aligned.apk"
            signed="${apk%.apk}-signed.apk"
            $ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign -v 4 "$apk" "$aligned" || true
            $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
              --ks /tmp/hetna_cnc.keystore \
              --ks-key-alias hetna_cnc \
              --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
              --out "$signed" "$aligned" || true
            mv "$signed" "$apk" 2>/dev/null || true
            rm -f "$aligned"
          done
          # El AAB se firma automáticamente con key.properties
      - name: Collect APKs and AAB
        run: |
          mkdir -p apk_output
          cp tmp_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apk_output/HetnaCNC_arm64.apk || true
          cp tmp_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk_output/HetnaCNC_arm32.apk || true
          cp tmp_app/build/app/outputs/bundle/release/app-release.aab apk_output/HetnaCNC_PlayStore.aab || true
          ls -lh apk_output/
      - name: Create Release with APK/AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HETNA CNC Build ${{ github.run_number }}
          files: apk_output/*
          body: |
            Build automatico de HETNA CNC
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.19.6
          channel: stable
      - run: flutter create --org com.hetnacnc --project-name hetna_cnc tmp_app
      - run: cp -r lib/* tmp_app/lib/ && cp pubspec.yaml tmp_app/pubspec.yaml && cp l10n.yaml tmp_app/l10n.yaml
      - run: flutter pub get
        working-directory: tmp_app
      - run: flutter build web --release --base-href /cotizador/ --pwa-strategy=none
        working-directory: tmp_app
      - name: Usar el ícono personalizado "Cotizador"
        run: |
          cp branding/icons/Icon-192.png tmp_app/build/web/icons/Icon-192.png
          cp branding/icons/Icon-512.png tmp_app/build/web/icons/Icon-512.png
          cp branding/icons/Icon-maskable-192.png tmp_app/build/web/icons/Icon-maskable-192.png
          cp branding/icons/Icon-maskable-512.png tmp_app/build/web/icons/Icon-maskable-512.png
          cp branding/icons/favicon.png tmp_app/build/web/favicon.png
      - name: Evitar cache vieja del navegador (.htaccess)
        run: |
          cat > tmp_app/build/web/.htaccess << 'HTACCESS'
          <IfModule mod_headers.c>
            <FilesMatch "\.(html|js|json)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
              Header set Pragma "no-cache"
              Header set Expires 0
            </FilesMatch>
          </IfModule>
          HTACCESS
      - name: Deploy a Hostinger via SFTP (hetnacnc.com/cotizador)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          local_path: tmp_app/build/web
          remote_path: domains/hetnacnc.com/public_html/cotizador
