name: Build HETNA CNC APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Crear estructura Android nativa
        run: |
          flutter create --org com.hetnacnc --project-name hetna_cnc hetna_base
          cp -r hetna_base/android ./android
          cp hetna_base/analysis_options.yaml ./analysis_options.yaml 2>/dev/null || true
          rm -rf hetna_base
          echo "✅ Estructura Android creada"

      - name: flutter pub get
        run: flutter pub get

      - name: Inyectar credenciales Supabase
        run: |
          sed -i "s|https://TU_PROYECTO.supabase.co|${{ secrets.SUPABASE_URL }}|g" lib/main.dart
          sed -i "s|TU_ANON_KEY|${{ secrets.SUPABASE_ANON_KEY }}|g" lib/main.dart

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Renombrar APKs
        run: |
          DATE=$(date +'%Y%m%d')
          mkdir -p apk_output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             apk_output/HetnaCNC_arm64_${DATE}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             apk_output/HetnaCNC_arm32_${DATE}.apk

      - name: Subir APKs
        uses: actions/upload-artifact@v4
        with:
          name: HetnaCNC-APK
          path: apk_output/
          retention-days: 30

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: "HETNA CNC v${{ github.run_number }}"
          body: |
            APK compilado automáticamente
            - arm64 → teléfonos modernos ✅ recomendado
            - arm32 → teléfonos antiguos
          files: apk_output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
