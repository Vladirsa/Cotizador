name: Build HETNA CNC APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Crear proyecto Flutter base
        run: flutter create --org com.hetnacnc --project-name hetna_cnc tmp_app

      - name: Actualizar Kotlin a 1.9.22
        run: |
          python3 - <<'EOF'
          import re, os
          
          # Actualizar settings.gradle
          sg = 'tmp_app/android/settings.gradle'
          if os.path.exists(sg):
              content = open(sg).read()
              content = re.sub(r'org\.jetbrains\.kotlin\.android["\s]+version["\s]+["\'][^"\']+["\']', 
                               'org.jetbrains.kotlin.android" version "1.9.22"', content)
              open(sg, 'w').write(content)
              print("settings.gradle actualizado:")
              print(content)
          
          # Actualizar build.gradle
          bg = 'tmp_app/android/build.gradle'
          if os.path.exists(bg):
              content = open(bg).read()
              content = re.sub(r"kotlin_version\s*=\s*['\"][^'\"]+['\"]", 
                               "kotlin_version = '1.9.22'", content)
              open(bg, 'w').write(content)
              print("build.gradle actualizado:")
              print(content)
          EOF

      - name: Copiar código
        run: |
          cp -r lib/* tmp_app/lib/
          cp pubspec.yaml tmp_app/pubspec.yaml

      - name: flutter pub get
        working-directory: tmp_app
        run: flutter pub get

      - name: Inyectar Supabase
        working-directory: tmp_app
        run: |
          sed -i "s|https://TU_PROYECTO.supabase.co|${{ secrets.SUPABASE_URL }}|g" lib/main.dart
          sed -i "s|TU_ANON_KEY|${{ secrets.SUPABASE_ANON_KEY }}|g" lib/main.dart

      - name: Build APK
        working-directory: tmp_app
        run: flutter build apk --release --split-per-abi

      - name: Recoger APKs
        run: |
          DATE=$(date +'%Y%m%d')
          mkdir -p apk_output
          cp tmp_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             apk_output/HetnaCNC_arm64_${DATE}.apk || true
          cp tmp_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             apk_output/HetnaCNC_arm32_${DATE}.apk || true
          ls -lh apk_output/

      - name: Subir APKs
        uses: actions/upload-artifact@v4
        with:
          name: HetnaCNC-APK
          path: apk_output/
          retention-days: 30
