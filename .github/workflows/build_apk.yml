name: Build HETNA CNC APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Crear estructura Android
        run: |
          flutter create --org com.hetnacnc --project-name hetna_cnc tmp_project
          cp -r tmp_project/android ./android
          rm -rf tmp_project

      - name: flutter pub get
        run: flutter pub get

      - name: Inyectar Supabase URL
        run: sed -i "s|https://TU_PROYECTO.supabase.co|${{ secrets.SUPABASE_URL }}|g" lib/main.dart

      - name: Inyectar Supabase Key
        run: sed -i "s|TU_ANON_KEY|${{ secrets.SUPABASE_ANON_KEY }}|g" lib/main.dart

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Preparar APKs
        run: |
          DATE=$(date +'%Y%m%d')
          mkdir -p apk_output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             apk_output/HetnaCNC_arm64_${DATE}.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             apk_output/HetnaCNC_arm32_${DATE}.apk || true
          ls -lh apk_output/

      - name: Subir APKs
        uses: actions/upload-artifact@v4
        with:
          name: HetnaCNC-APK
          path: apk_output/
          retention-days: 30
