name: Build HETNA CNC APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable
      - run: flutter create --org com.hetnacnc --project-name hetna_cnc tmp_app
      - name: Fix Android versions
        run: |
          cd tmp_app/android
          sed -i 's/kotlin.android" version "[^"]*"/kotlin.android" version "1.9.22"/' settings.gradle
          sed -i 's/com.android.application" version "[^"]*"/com.android.application" version "8.1.0"/' settings.gradle
          sed -i 's/gradle-[0-9]*\.[0-9]*-[a-z]*.zip/gradle-8.3-all.zip/' gradle/wrapper/gradle-wrapper.properties
          cd app
          sed -i 's/compileSdk.*/compileSdk = 34/' build.gradle
          sed -i 's/targetSdk.*/targetSdk = 34/' build.gradle
          sed -i 's/minSdk.*/minSdk = 21/' build.gradle
          cat build.gradle
      - run: cp -r lib/* tmp_app/lib/ && cp pubspec.yaml tmp_app/pubspec.yaml
      - run: flutter pub get
        working-directory: tmp_app
      - name: Inject Supabase
        working-directory: tmp_app
        run: |
          sed -i "s|https://TU_PROYECTO.supabase.co|${{ secrets.SUPABASE_URL }}|g" lib/main.dart
          sed -i "s|TU_ANON_KEY|${{ secrets.SUPABASE_ANON_KEY }}|g" lib/main.dart
      - run: flutter build apk --release --split-per-abi
        working-directory: tmp_app
      - name: Collect APKs
        run: |
          mkdir -p apk_output
          cp tmp_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apk_output/HetnaCNC_arm64.apk || true
          cp tmp_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk_output/HetnaCNC_arm32.apk || true
          ls -lh apk_output/
      - uses: actions/upload-artifact@v4
        with:
          name: HetnaCNC-APK
          path: apk_output/
          retention-days: 30
