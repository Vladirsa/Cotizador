name: Build HETNA CNC APK + AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.19.6
          channel: stable
      - run: flutter create --org com.hetnacnc --project-name hetna_cnc tmp_app
      - name: Fix versions
        run: |
          sed -i 's/1.7.10/1.9.22/' tmp_app/android/settings.gradle
          sed -i 's/"com.android.application" version "7.3.0"/"com.android.application" version "8.1.0"/' tmp_app/android/settings.gradle
          sed -i 's/gradle-7.6.3-all.zip/gradle-8.3-all.zip/' tmp_app/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/flutter.compileSdkVersion/34/' tmp_app/android/app/build.gradle
          sed -i 's/flutter.targetSdkVersion/34/' tmp_app/android/app/build.gradle
          sed -i 's/flutter.minSdkVersion/21/' tmp_app/android/app/build.gradle
      - name: Add Internet Permission
        run: |
          MANIFEST="tmp_app/android/app/src/main/AndroidManifest.xml"
          grep -q "INTERNET" $MANIFEST || sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application/' $MANIFEST
          cat $MANIFEST
      - name: Inject Firebase google-services.json
        run: |
          echo "" | base64 -d > tmp_app/android/app/google-services.json
          echo "google-services.json inyectado"
      - name: Configure Firebase - inject build.gradle files
        run: |
          # Reemplazar build.gradle raiz con version que incluye google-services
          echo "" | base64 -d > tmp_app/android/build.gradle
          echo "build.gradle raiz reemplazado"

          # Reemplazar app/build.gradle con version que incluye firebase
          echo "" | base64 -d > tmp_app/android/app/build.gradle
          echo "app/build.gradle reemplazado"

          # Verificar
          grep -n "google-services" tmp_app/android/build.gradle
          grep -n "google-services" tmp_app/android/app/build.gradle
      - run: cp -r lib/* tmp_app/lib/ && cp pubspec.yaml tmp_app/pubspec.yaml
      - run: flutter pub get
        working-directory: tmp_app
      - run: flutter build apk --release --split-per-abi
        working-directory: tmp_app
      - run: flutter build appbundle --release
        working-directory: tmp_app
      - name: Sign APK and AAB
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/hetna_cnc.keystore
          # Firmar APKs
          for apk in tmp_app/build/app/outputs/flutter-apk/app-*-release.apk; do
            aligned="${apk%.apk}-aligned.apk"
            signed="${apk%.apk}-signed.apk"
            $ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign -v 4 "$apk" "$aligned" || true
            $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
              --ks /tmp/hetna_cnc.keystore \
              --ks-key-alias hetna_cnc \
              --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
              --out "$signed" "$aligned" || true
            mv "$signed" "$apk" 2>/dev/null || true
            rm -f "$aligned"
          done
          # El AAB se firma automáticamente con key.properties
      - name: Collect APKs and AAB
        run: |
          mkdir -p apk_output
          cp tmp_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apk_output/HetnaCNC_arm64.apk || true
          cp tmp_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk_output/HetnaCNC_arm32.apk || true
          cp tmp_app/build/app/outputs/bundle/release/app-release.aab apk_output/HetnaCNC_PlayStore.aab || true
          ls -lh apk_output/
      - uses: actions/upload-artifact@v4
        with:
          name: HetnaCNC-APK-AAB
          path: apk_output/
          retention-days: 30
