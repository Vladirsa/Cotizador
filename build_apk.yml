name: Build HETNA CNC APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite ejecutar manualmente desde GitHub

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar el código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Instalar Java (requerido por Android SDK)
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instalar Flutter
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      # 4. Verificar instalación
      - name: flutter doctor
        run: flutter doctor -v

      # 5. Descargar dependencias del proyecto
      - name: flutter pub get
        run: flutter pub get

      # 6. Inyectar credenciales de Supabase desde GitHub Secrets
      - name: Inyectar credenciales Supabase
        run: |
          sed -i "s|https://TU_PROYECTO.supabase.co|${{ secrets.SUPABASE_URL }}|g" lib/main.dart
          sed -i "s|TU_ANON_KEY|${{ secrets.SUPABASE_ANON_KEY }}|g" lib/main.dart
          echo "✅ Credenciales inyectadas correctamente"

      # 7. Compilar APK release (sin firma, para pruebas)
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # 8. Renombrar APKs con versión y fecha
      - name: Renombrar APKs
        run: |
          DATE=$(date +'%Y%m%d')
          mkdir -p apk_output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             apk_output/HetnaCNC_arm64_${DATE}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             apk_output/HetnaCNC_arm32_${DATE}.apk
          echo "APKs generados:"
          ls -lh apk_output/

      # 9. Subir APKs como artefactos descargables
      - name: Subir APKs
        uses: actions/upload-artifact@v4
        with:
          name: HetnaCNC-APK
          path: apk_output/
          retention-days: 30

      # 10. Crear Release automático en GitHub
      - name: Crear Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: "HETNA CNC v${{ github.run_number }}"
          body: |
            ## HETNA CNC Cotizador Pro
            APK compilado automáticamente el ${{ github.event.head_commit.timestamp }}
            
            ### Descargar:
            - **arm64** → para teléfonos modernos (2018 en adelante) ✅ recomendado
            - **arm32** → para teléfonos antiguos
            
            ### Instalar:
            1. Descargar el APK en tu teléfono Android
            2. Ir a Ajustes → Seguridad → Permitir fuentes desconocidas
            3. Abrir el archivo APK e instalar
          files: apk_output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
